interface:
  display_name: 'pull-request'
  short_description: 'Draft, confirm, push, create, and self-assign GitHub PRs'
  default_prompt: 'Use $pull-request to draft an intent-focused PR against main, confirm the title and a sectioned PR body with English `##` headings and concise bullets with me, push the current branch if needed, create the PR with gh, and self-assign me when possible.'

policy:
  allow_implicit_invocation: false
