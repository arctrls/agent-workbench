# Only repository-owned features and MCP keys are synced.
# Model preferences, plugin state, and other app-managed settings stay local.

[features]
multi_agent = true

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v1/mcp/authv2"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.context7.env]
DEFAULT_MINIMUM_TOKENS = "6000"

[mcp_servers.mcp-installer]
command = "npx"
args = ["@anaisbetts/mcp-installer"]

[mcp_servers.mysql-mcp-server]
command = "uvx"
args = [
  "--with",
  "mcp<2",
  "awslabs.mysql-mcp-server==1.0.20",
  "--hostname",
  "dev-20251223-cluster.cluster-ro-cn1xjryhj9xq.ap-northeast-2.rds.amazonaws.com",
  "--secret_arn",
  "arn:aws:secretsmanager:ap-northeast-2:170023315897:secret:database/mcp/dev/credentials-7bZ8iP",
  "--database",
  "hmmall",
  "--region",
  "ap-northeast-2",
  "--readonly",
  "True",
]

[mcp_servers.mysql-mcp-server.env]
AWS_PROFILE = "default"
AWS_REGION = "ap-northeast-2"
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.notion]
command = "npx"
args = ["-y", "@notionhq/notion-mcp-server"]
env_vars = ["NOTION_TOKEN"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
